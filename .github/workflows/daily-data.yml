# Saves today's 16-day weather forecast into data/raw/weather/forecast/ every
# evening, even when your laptop is off.
# Mandi prices are NOT fetched here: data.gov.in does not answer GitHub's
# (US) servers, so they come from the laptop task in scripts/daily_prices.ps1.
name: daily-data

on:
  schedule:
    - cron: "15 15 * * *"   # 15:15 UTC = 20:45 IST
  workflow_dispatch:         # lets you run it by hand from the Actions tab

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"   # same as local, matches requirements.txt pins
      - run: pip install -r requirements.txt
      - name: Save today's weather forecast
        run: python -m krishibhav fetch-weather --raw-only
      - name: Commit new data
        run: |
          git config user.name "krishibhav-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A data/raw/weather
          git diff --cached --quiet || git commit -m "data: weather forecast $(date +%F)"
          git push
