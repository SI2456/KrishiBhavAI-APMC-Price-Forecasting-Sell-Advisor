# Saves today's Gujarat mandi prices from data.gov.in into data/raw/datagov/
# every evening, even when your laptop is off.
# Setup: GitHub repo -> Settings -> Secrets and variables -> Actions ->
#        New repository secret: DATAGOV_API_KEY
name: daily-data

on:
  schedule:
    - cron: "15 15 * * *"   # 15:15 UTC = 20:45 IST, after most yards have reported
  workflow_dispatch:         # lets you run it by hand from the Actions tab

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"   # same as local, matches requirements.txt pins
      - run: pip install -r requirements.txt
      - name: Fetch today's prices
        env:
          DATAGOV_API_KEY: ${{ secrets.DATAGOV_API_KEY }}
        run: python -m krishibhav fetch-today --raw-only
      - name: Commit new data
        run: |
          git config user.name "krishibhav-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/raw/datagov
          git diff --cached --quiet || git commit -m "data: mandi prices $(date +%F)"
          git push
